<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Gallery Basic</title>
		<style>
			h2 {
				text-align: center;
			}
			#container {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				justify-content: center;
			}
			div {
				height: 100px;
				width: 100px;
				margin: 2px;
				border-radius: 12px;
				background-color: blueviolet;
				/* sử dụng flexbox để căn ảnh */
				display: flex;
				align-items: center;
				justify-content: center;
				/* căn stt bên dưới ảnh */
				flex-flow: column;
			}
		</style>
	</head>
	<body>
		<h2>Danh sách ảnh</h2>
		<section id="container"></section>
		<script src="main.js"></script>
	</body>
</html>
