<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Truy cập parent, child, siblings</title>
	</head>
	<body>
		<div class="container">
			<h1>đây là anh của div</h1>
			<div id="elm">
				<h2 class="child1">Đây là thẻ con thứ 1 của div</h2>
				<h2 class="child2">Đây là thẻ con thứ 2 của div</h2>
				<h2 class="child3">Đây là thẻ con thứ 3 của div</h2>
			</div>
			<h1>đây là em của div</h1>
		</div>
		<script src="5.js"></script>
	</body>
</html>
